name: Update GitHub Stats Cards

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:        # allow manual trigger
  push:
    branches: [main]

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Stats SVG
        run: |
          curl -f -o assets/stats.svg \
            "https://github-readme-stats.vercel.app/api?username=G1NYU&show_icons=true&theme=midnight-purple&border_radius=12&hide_border=true&bg_color=0d1117&title_color=a78bfa&icon_color=7c3aed&text_color=c4b5fd" \
            || echo "Stats fetch failed, keeping existing file"

      - name: Fetch Top Languages SVG
        run: |
          curl -f -o assets/top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=G1NYU&layout=compact&theme=midnight-purple&hide_border=true&bg_color=0d1117&title_color=a78bfa&text_color=c4b5fd" \
            || echo "Top langs fetch failed, keeping existing file"

      - name: Commit updated SVGs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet || git commit -m 'chore: update github stats cards [skip ci]'
          git push
